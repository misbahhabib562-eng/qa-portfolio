name: QA tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  playwright:
    name: Playwright (UI + API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  postman:
    name: Postman (Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx newman run postman/restful-booker.postman_collection.json --reporters cli,junit --reporter-junit-export newman-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-results
          path: newman-results.xml

  jmeter:
    name: JMeter (light load)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JMeter
        run: |
          curl -sSL https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz | tar xz
          echo "$PWD/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"
      - name: Run load test
        run: |
          mkdir -p jmeter/results
          jmeter -n -t jmeter/restful-booker-load-test.jmx -Jusers=3 -Jrampup=5 -Jloops=2 \
                 -l jmeter/results/results.jtl -e -o jmeter/results/report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-report
          path: jmeter/results/
